<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Marcador de acuario</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="arcade">
    <header class="topbar">
      <div class="scorebox">
        <span class="label">PUNTOS</span>
        <span id="score" class="score" aria-live="polite">0</span>
      </div>
      <div class="infobox">
        <div>Agua: <span id="level" aria-live="polite">40%</span></div>
        <div>Pez: <span id="fishState" aria-live="polite">😊 feliz</span></div>
        <div id="milestoneFlash" class="flash"></div>
      </div>
    </header>

    <div id="aquarium-root" class="tank"></div>

    <section class="controls">
      <button data-delta="-10" title="-10 puntos">−10</button>
      <button data-delta="-1" title="-1 punto">−1</button>
      <button data-delta="1" class="good" title="+1 punto">+1</button>
      <button data-delta="10" class="good" title="+10 puntos">+10</button>
      <button id="restart" class="ghost" title="Reiniciar partida">Reiniciar</button>
      <button id="mute" class="ghost" title="Silenciar">🔊</button>
    </section>

    <section id="gameover" class="gameover" style="display:none">
      <div class="panel">
        <h2>Fin del juego</h2>
        <p>El agua llegó al fondo con una puntuación de <strong id="finalScore">0</strong>.</p>
        <button data-delta="1" hidden>+1</button>
        <button class="good" onclick="document.getElementById('restart').click()">Jugar otra vez</button>
      </div>
    </section>

    <footer class="hint">
      El agua sube con los puntos y baja con los fallos. A −20 el pez muere y el juego termina.
    </footer>
  </main>
  <script type="module" src="js/app.js"></script>
</body>
</html>
